name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR (based on another fix/* branch) runs CI too.
  pull_request:
  # release.yml runs this whole workflow before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: test (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound must match "engines.bun" in package.json.
        bun: ["1.2.20", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - name: bun test (root, includes packages)
        run: bun test
      - name: bun test (packages/yaml-parser on its own)
        working-directory: packages/yaml-parser
        run: bun test

  package:
    name: package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound must match "engines.node" in package.json.
        node: ["20", "lts/*"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Tarball contents (npm pack --dry-run)
        run: npm pack --dry-run
      - name: Install the tarball in an empty project; use it from Node; README quick example
        run: bun run test:consumer

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run knip

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # python3 (preinstalled on ubuntu-latest) backs the Python-target claim test.
      - run: python3 --version
      - run: bun run check:claims

  stale-narrative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run check:stale-narrative

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Conventional Commits in this PR / push
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has an all-zero "before", and a force-push leaves "before"
          # unreachable; both fall back to everything not yet on main.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD")
            echo "Base commit unavailable; checking $BASE..$HEAD (since main)."
          fi
          bun run scripts/check-commits.ts "$BASE..$HEAD"

  semver-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: The examples' @version covers their interface changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Same fallback as the commits job: a new branch or a force-push has no usable "before".
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD)
            echo "Base commit unavailable; comparing with $BASE (merge-base with main)."
          fi
          bun run cli semver-check docs/examples --base "$BASE"
