name: Release

# A v* tag publishes @promptlang/core (and @promptlang/yaml-parser when its
# version is not on npm yet), after the whole CI workflow passes on the tag.
# Run by hand, it is always a dry run: only a tag publishes, so every published
# version has passed the tag/version check below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two releases at once could race on the "is this version on npm" checks.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Protection rules (required reviewers) can be set on this environment.
    environment: npm
    permissions:
      contents: read
      # OIDC token for npm provenance: the registry records which workflow built the tarball.
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile

      - name: The tag names the version in package.json
        if: github.event_name == 'push'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($VERSION)."
            exit 1
          fi

      # Decided before anything is published, so a registry outage stops the job
      # here instead of after @promptlang/core is out. Only E404 means "not on npm".
      - name: Is this @promptlang/yaml-parser version on npm?
        id: yaml_parser
        working-directory: packages/yaml-parser
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if OUT="$(npm view "@promptlang/yaml-parser@$VERSION" version 2>&1)"; then
            echo "@promptlang/yaml-parser@$VERSION is already on npm; it is skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q E404; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"
            exit 1
          fi

      - name: Publish @promptlang/core
        # prepack runs scripts/build.ts, so the tarball holds a fresh dist/.
        # A prerelease (2.1.0-rc.1) goes to the "next" dist-tag, never to "latest".
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in *-*) TAG="--tag next" ;; *) TAG="" ;; esac
          npm publish --provenance --access public $TAG $DRY_RUN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @promptlang/yaml-parser
        if: steps.yaml_parser.outputs.publish == 'true'
        working-directory: packages/yaml-parser
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in *-*) TAG="--tag next" ;; *) TAG="" ;; esac
          npm publish --provenance --access public $TAG $DRY_RUN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
