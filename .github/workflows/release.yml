name: Release

# A v* tag publishes @promptlang/core (and @promptlang/yaml-parser when its
# version is not on npm yet) through npm trusted publishing (OIDC, no token),
# after the whole CI workflow passes on the tag, then
# creates the GitHub Release with the same tarball and its signed provenance.
# Run by hand, it is always a dry run: only a tag publishes, attests or creates a
# release, so every published version has passed the tag/version check below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two releases at once could race on the "is this version on npm" checks.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Protection rules (required reviewers) can be set on this environment.
    environment: npm
    permissions:
      contents: read
      # OIDC token: npm trusted publishing authenticates the publish with it (no npm
      # token exists), and npm provenance and the Sigstore certificate that signs the
      # GitHub attestation record which workflow built the tarball.
      id-token: write
      # Stores the tarball's build provenance in the repository's attestations.
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. "lts/*" moves,
      # and so does the npm it bundles, so the npm that publishes is pinned, and both
      # versions are checked before anything is packed.
      - name: Install the npm that trusted publishing needs
        run: npm install -g npm@11.21.1
      - name: Node and npm meet the trusted-publishing minimums
        run: |
          node --version
          npm --version
          node -e '
            const atLeast = (v, min) => {
              const a = v.replace(/^v/, "").split(".").map(Number);
              const b = min.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i];
              return true;
            };
            const npm = require("node:child_process").execSync("npm --version").toString().trim();
            const bad = [];
            if (!atLeast(process.version, "22.14.0")) bad.push(`Node ${process.version} < 22.14.0`);
            if (!atLeast(npm, "11.5.1")) bad.push(`npm ${npm} < 11.5.1`);
            if (bad.length) { console.error(bad.join("; ")); process.exit(1); }
          '
      - run: bun install --frozen-lockfile

      - name: The tag names the version in package.json
        if: github.event_name == 'push'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($VERSION)."
            exit 1
          fi

      # The GitHub Release body; checked here because the release job runs after npm.
      - name: The tag has release notes
        if: github.event_name == 'push'
        run: test -f "docs/release-notes/$GITHUB_REF_NAME.md"

      # Decided before anything is published, so a registry outage stops the job
      # here instead of after @promptlang/core is out. Only E404 means "not on npm".
      - name: Is this @promptlang/yaml-parser version on npm?
        id: yaml_parser
        working-directory: packages/yaml-parser
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if OUT="$(npm view "@promptlang/yaml-parser@$VERSION" version 2>&1)"; then
            echo "@promptlang/yaml-parser@$VERSION is already on npm; it is skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q E404; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"
            exit 1
          fi

      # Packed once: npm, the attestation and the GitHub Release all get these bytes.
      # prepack runs scripts/build.ts, so the tarball holds a fresh dist/.
      - name: Pack @promptlang/core
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          TARBALL="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          sha256sum "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Before npm publish: if signing fails, nothing has been published yet.
      - name: Attest the tarball's build provenance
        id: attest
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # Still before npm publish, so a failure here leaves nothing published. The
      # Sigstore bundle keeps a .sigstore.json name, the suffix Scorecard's
      # Signed-Releases check reads as a signature.
      - name: Keep the tarball and its signed attestation for the release job
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$TARBALL" "$RUNNER_TEMP/release/"
          cp "$BUNDLE" "$RUNNER_TEMP/release/$(basename "$TARBALL").sigstore.json"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

      - name: Publish @promptlang/core
        # A prerelease (2.1.0-rc.1) goes to the "next" dist-tag, never to "latest".
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in *-*) TAG="--tag next" ;; *) TAG="" ;; esac
          npm publish "$TARBALL" --provenance --access public $TAG $DRY_RUN
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}

      - name: Publish @promptlang/yaml-parser
        if: steps.yaml_parser.outputs.publish == 'true'
        working-directory: packages/yaml-parser
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in *-*) TAG="--tag next" ;; *) TAG="" ;; esac
          npm publish --provenance --access public $TAG $DRY_RUN

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub Release for the tag and uploads its assets.
      contents: write
    steps:
      # gh reads GH_TOKEN; the write token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      # No release without its signed provenance: an unsigned release would count 0
      # in Signed-Releases' average, and users could not verify the tarball.
      - name: Create the GitHub Release with the tarball and its attestation
        run: |
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; *) PRE="" ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/*.tgz \
            release-assets/*.tgz.sigstore.json --verify-tag $PRE \
            --title "PromptLang ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ github.token }}
